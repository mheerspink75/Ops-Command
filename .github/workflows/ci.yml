name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep concurrent runs for the same ref from piling up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite:///./ci_backend.db
      SECRET_KEY: ci-only-signing-key-0123456789-0123456789-0123456789
      OTEL_ENABLED: "false"
      METRICS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Test (pytest)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: Production build
        working-directory: frontend
        run: npm run build

  migrations:
    name: Migrations (upgrade + consistency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opscommand
          POSTGRES_PASSWORD: opscommand
          POSTGRES_DB: opscommand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opscommand -d opscommand"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://opscommand:opscommand@localhost:5432/opscommand
      SECRET_KEY: ci-only-signing-key-0123456789-0123456789-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Consistency check (alembic check)
        working-directory: backend
        run: alembic check

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t opscommand-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t opscommand-frontend:ci ./frontend

      - name: Build mock-webhook image
        run: docker build -f mock-webhook/Dockerfile -t opscommand-mock-webhook:ci ./mock-webhook

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scan Python dependencies (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Scan Node dependencies (npm audit)
        working-directory: frontend
        # Only fail on critical: high/moderate findings are in transitive dev
        # dependencies (braces, esbuild, react-router) whose fixes require
        # major-version upgrades not yet available in our dependency tree.
        run: npm audit --audit-level=critical
